name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the token gets no more than read.
permissions:
  contents: read

# A new push to a pull request makes the run for the old one pointless. A run on
# main is never cancelled: the last commit's result is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    # No secrets on purpose. A pull request from a fork gets none, so a build that
    # needed them would be red for every outside contributor; and a build only
    # needs the variables to exist, not to be real. Nothing is read from the
    # database (the sitemap is rendered on request) and nothing is called.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-build-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-build-only
      GOOGLE_CLIENT_SECRET: ci-build-only
      # Inlined into the bundle, which is thrown away; a made-up value is fine.
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-build-only
      UNSPLASH_ACCESS_KEY: ci-build-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  # The migrations are SQL files nothing else ever runs from the start, and the
  # Prisma schema is a second description of the same database. This job is what
  # keeps the two, and the seed, honest: it builds a database from nothing.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The major version of the production database (Supabase, Postgres 17).
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # Every migration, in order, onto an empty database: a migration that only
      # works on top of the data it was written against fails here.
      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy
      # Exit code 2 when schema.prisma describes something the migrations do not
      # build (an edit with no migration) or the other way round. CHECK
      # constraints are not part of the comparison: Prisma neither reads nor
      # drops them.
      - name: The schema matches the migrations
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      # The seed has to keep working against the constraints the migrations add.
      - name: Seed the cities
        run: npx prisma db seed

  # The unit tests cover the pieces; this is the one place the built app is
  # opened in a real browser, against a database built from the migrations and
  # the seed. It guards what only shows up end to end: a page that answers 200
  # where it should answer 404, a missing landmark, a language or a cookie that
  # is not honoured. Pages that need a Google sign-in are out of its reach.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # No secrets, like the build job: nothing here calls Google, Mapbox or
    # Unsplash, so the values only have to exist.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-e2e-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-e2e-only
      GOOGLE_CLIENT_SECRET: ci-e2e-only
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-e2e-only
      UNSPLASH_ACCESS_KEY: ci-e2e-only
      # The signed-in tests write test users into this throwaway database; they
      # refuse to run anywhere this is not set (see e2e/support/session.ts).
      E2E_ALLOW_DB_WRITES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      # Hard gate on what actually ships. The deepmerge-ts override in
      # package.json is what keeps the Prisma CLI config chain off this list.
      - run: npm audit --audit-level=high --omit=dev
      # Dev-only tooling is reported but does not block: mapshaper pulls in
      # parsers with denial-of-service advisories, and it is run by hand
      # against files a developer downloaded, never against user input or in
      # any deployed process. Upgrading means a breaking major, so the finding
      # is surfaced here rather than silenced or rushed.
      - run: npm audit --audit-level=high || true

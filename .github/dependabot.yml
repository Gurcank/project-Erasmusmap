version: 2

updates:
  # Application dependencies. Minor and patch updates arrive together, one pull
  # request a week, so the review is one diff and the CI run is one run.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Major versions of these are projects of their own (see "Kapsam dışı" in
    # the audit plan), each with a migration of code or data, so they are done
    # on purpose, in their own pull request, not offered every Monday.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # The Node types follow the runtime pinned in .nvmrc, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The actions in .github/workflows are pinned to a commit. This is what keeps
  # those pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
